name: Build AI APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease -x lint -x test --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Print failure log
        if: failure()
        run: |
          echo "=== BUILD LOG FAILURE TAIL ==="
          tail -n 250 build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p output-apk
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp $(ls app/build/outputs/apk/release/*.apk | head -n 1) output-apk/AutoAccounting-AI.apk
          else
            cp $(find app/build/outputs/apk/ -name "*.apk" | head -n 1) output-apk/AutoAccounting-AI.apk
          fi
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoAccounting-AI-apk
          path: output-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v4.0.2-ai-r${{ github.run_number }}"
          name: "AutoAccounting AI 助理版 (Build ${{ github.run_number }})"
          body: |
            ### 🤖 AutoAccounting AI 财务助理版
            - **BYOK 自定义大模型**：支持接入 DeepSeek、OpenAI 等标准兼容 API
            - **自然语言查账**：随时通过自然语言对话查询近期收支流水
            - **智能修改分类**：AI 自动识别账单并通过工具直接修改并入账本地数据库
            - **月度消费深度分析**：分析每月各分类支出占比，输出个性化省钱建议
          files: output-apk/AutoAccounting-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
